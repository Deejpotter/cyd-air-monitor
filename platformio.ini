; PlatformIO Project Configuration File

[platformio]
src_dir = src
default_envs = 2432s028r

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
lib_ldf_mode = deep
lib_deps = 
	bodmer/TFT_eSPI@^2.5.42
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git 
	lvgl/lvgl@^8.3.6
	adafruit/DHT sensor library@^1.4.4
	https://github.com/bitbank2/bb_captouch.git

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
	-I./src/
	-I./src/ui/
	-DUSER_SETUP_LOADED
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
extra_scripts = pre:scripts/copy_template.py

[env:jc2432w328r]
build_flags =
	${env.build_flags}
	-DTFT_INVERSION_OFF
	-DST7789_2_DRIVER
	-DUSE_VSPI_PORT
	-DLVGL_ROTATION=1
	-DTFT_DISPLAY_ROTATION=3
	-DTOUCH_ROTATION=1
	-DTOUCH_MIRROR_X=1
	-DTOUCH_MIRROR_Y=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTOUCH_CS=33 ; Enable touch (XPT2046 CS)
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DMODEL_JC2432W328R
	; MODEL macro implies resistive touch
	; Optional: Resistive touch calibration (override defaults)
	-DTOUCH_X_MIN=200
	-DTOUCH_X_MAX=3700
	-DTOUCH_Y_MIN=240
	-DTOUCH_Y_MAX=3800
	-DTOUCH_TYPE_RESISTIVE

; Notes:
; - Resistive JC2432W328R: display rot 3, touch rot 1 + mirror both axes
; - See docs/DISPLAY_CONFIG.md

[env:jc2432w328c]
build_flags =
	${env.build_flags}
	-DTFT_INVERSION_OFF
	-DI2C_SDA=33
	-DI2C_SCL=32
	-DCST820_TOUCH
	-DMODEL_JC2432W328C
	-DST7789_2_DRIVER
	-DUSE_VSPI_PORT
	-DLVGL_ROTATION=1
	-DTFT_DISPLAY_ROTATION=1
	-DCAP_TOUCH_NATIVE_LANDSCAPE=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	; MODEL macro implies capacitive touch
	-DCST820_RST=25
	-DCST820_INT=21
	-DTOUCH_TYPE_CAPACITIVE

; Notes:
; - Capacitive JC2432W328C: CST820/CST816 on I2C, native portrait touch map
; - If touch dead, try CST820_INT=36 instead of 21 (board revision dependent)
; - See docs/DISPLAY_CONFIG.md

[env:2432s028r]
build_flags =
	${env.build_flags}
	-DTFT_INVERSION_OFF
	-DST7789_2_DRIVER
	-DUSE_VSPI_PORT
	-DLVGL_ROTATION=1
	-DTFT_DISPLAY_ROTATION=1
	-DTFT_MADCTL_OVERRIDE=0x20
	-DTOUCH_ROTATION=1
	-DTOUCH_MIRROR_X=1
	-DTOUCH_MIRROR_Y=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTOUCH_CS=33
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_BACKLIGHT_OFF=LOW
	-DLOAD_GLCD
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DMODEL_2432S028R
	-DTOUCH_TYPE_RESISTIVE
	; XPT2046 touch SPI pins (different from JC2432W328R)
	-DTOUCH_MOSI=32
	-DTOUCH_MISO=39
	-DTOUCH_CLK=25
	-DTOUCH_IRQ=36

; Notes:
; - Original CYD ESP32-2432S028R (dual USB, ST7789)
; - Display: rot 1 + MADCTL 0x20 (MV only) fixes single-axis flip vs rot 1/3 alone
; - Touch: separate SPI bus; DHT11 on GPIO 27, backlight on GPIO 21
; - See docs/DISPLAY_CONFIG.md
